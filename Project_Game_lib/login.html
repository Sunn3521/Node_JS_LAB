<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Login</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: 'Orbitron', sans-serif;
  background:
    linear-gradient(rgba(10,10,30,0.8), rgba(10,10,30,0.95)),
    url('https://images.unsplash.com/photo-1542751371-adc38448a05e');
  background-size: cover;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0,255,255,0.1), transparent 70%);
}

.wrapper {
  width: 340px;
  padding: 35px;
  border-radius: 14px;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(0,255,255,0.25);
  box-shadow: 0 0 30px rgba(0,255,255,0.4);
  position: relative;
}

.img-area img {
  display: block;
  margin: 0 auto 25px;
  width: 130px;
  filter: drop-shadow(0 0 15px cyan);
}

h2 {
  text-align: center;
  color: cyan;
  margin-bottom: 20px;
}

.input-box {
  margin-bottom: 15px;
}

.input-box input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid rgba(0,255,255,0.3);
  background: #020617;
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  background: cyan;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  color: black;
  cursor: pointer;
}

button:hover {
  box-shadow: 0 0 15px cyan;
}

.footer {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #94a3b8;
}

a {
  color: cyan;
  text-decoration: none;
}
a:hover {
  text-shadow: 0 0 10px cyan;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="img-area">
    <img src="1.png" alt="Game Logo">
  </div>

  <h2>PLAYER LOGIN</h2>

  <form id="loginForm">
    <div class="input-box">
      <input type="text" placeholder="Username" required>
    </div>

    <div class="input-box">
      <input type="password" placeholder="Password" required>
    </div>

    <button type="submit">ENTER GAME</button>
  </form>

  <div class="footer">
    Access restricted • Authorized players only
    <br><br>
    <a href="register.html">Create Account</a>
  </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  // ✅ CHANGED HERE
  window.location.href = "home.html";
});
</script>

</body>
</html>
