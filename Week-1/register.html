<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    body {
      background-color: #988c8c;
      font-family: Arial, sans-serif;
    }
    .form-box {
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }
    .wrapper {
      background: #f0f0f0;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 400px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    table {
      margin: 0 auto;
      background-color: #808080;
      padding: 10px;
      border-radius: 5px;
      width: 100%;
    }
    td {
      padding: 8px;
      color: #fff;
    }
    input[type="text"], 
    input[type="password"], 
    input[type="date"], 
    input[type="email"],
    select, 
    textarea {
      width: 100%;
      padding: 6px;
      border: none;
      border-radius: 4px;
    }
    input[type="radio"], input[type="checkbox"] {
      margin-right: 5px;
    }
    input[type="submit"], input[type="reset"] {
      padding: 8px 16px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    input[type="submit"]:hover, input[type="reset"]:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <div class="wrapper">
      <h1>Registration Page</h1>
      <form name="register" method="post" onsubmit="return validateForm()">
        <table>
          <tr>
            <td>User Name:</td>
            <td><input type="text" name="uname" required minlength="3"></td>
          </tr>
          <tr>
            <td>Password:</td>
            <td><input type="password" name="pwd" required minlength="6"></td>
          </tr>
          <tr>
            <td>E-mail:</td>
            <td><input type="email" name="email" required></td>
          </tr>
          <tr>
            <td>Phone Number:</td>
            <td><input type="text" name="phno" maxlength="10" pattern="[0-9]{10}" required></td>
          </tr>
          <tr>
            <td>Gender:</td>
            <td>
              <input type="radio" name="gender" value="Male" required> Male
              <input type="radio" name="gender" value="Female"> Female
            </td>
          </tr>
          <tr>
            <td>Date Of Birth:</td>
            <td><input type="date" name="dob" required></td>
          </tr>
          <tr>
            <td>Languages Known:</td>
            <td>
              <input type="checkbox" name="chkEng"> English
              <input type="checkbox" name="chkHin"> Hindi
              <input type="checkbox" name="chkTel"> Telugu
              <input type="checkbox" name="chkTam"> Tamil
            </td>
          </tr>
          <tr>
            <td>State:</td>
            <td>
              <select name="states" required>
                <option value="">Select State</option>
                <option value="Telangana">Telangana</option>
                <option value="AP">Andhra Pradesh</option>
                <option value="MP">Madhya Pradesh</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Tamilnadu">Tamil Nadu</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>District:</td>
            <td>
              <select name="dist" required>
                <option value="">Select District</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Warangal">Warangal</option>
                <option value="RangaReddy">Ranga Reddy</option>
                <option value="Karimnagar">Karimnagar</option>
                <option value="Nalgonda">Nalgonda</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Address:</td>
            <td><textarea rows="4" name="txtAddress" required minlength="10"></textarea></td>
          </tr>
          <tr>
            <td colspan="2" align="center">
              <input type="submit" value="Register">
              <input type="reset" value="Reset">
            </td>
          </tr>
        </table>
      </form>
    </div>
  </div>

  <script>
    function validateForm() {
      let uname = document.register.uname.value.trim();
      let pwd = document.register.pwd.value.trim();
      let phno = document.register.phno.value.trim();
      let dob = document.register.dob.value;
      let address = document.register.txtAddress.value.trim();

      // Username validation
      if (uname.length < 3) {
        alert("Username must be at least 3 characters long.");
        return false;
      }

      // Password validation
      if (pwd.length < 6) {
        alert("Password must be at least 6 characters long.");
        return false;
      }

      // Phone number validation
      if (!/^\d{10}$/.test(phno)) {
        alert("Phone number must be exactly 10 digits.");
        return false;
      }

      // DOB validation (must not be future date)
      let today = new Date();
      let birthDate = new Date(dob);
      if (birthDate > today) {
        alert("Date of Birth cannot be in the future.");
        return false;
      }

      // Language validation (at least one checkbox)
      let chkEng = document.register.chkEng.checked;
      let chkHin = document.register.chkHin.checked;
      let chkTel = document.register.chkTel.checked;
      let chkTam = document.register.chkTam.checked;
      if (!chkEng && !chkHin && !chkTel && !chkTam) {
        alert("Please select at least one language.");
        return false;
      }

      // Address validation
      if (address.length < 10) {
        alert("Address must be at least 10 characters long.");
        return false;
      }

      return true; // Form is valid
    }
  </script>
</body>
</html>
