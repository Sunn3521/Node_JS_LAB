<html>
<head>
<title>Register</title>
</head>
<body bgcolor="#d3d3d3">
<form name="register" method="post">
<table align="center" bgcolor="#808080">
<caption><h1><b><u>Registration Page</u></b></h1></caption>
<tr>
<td>User Name:</td>
<td><input type="text" name="uname"></td>
</tr>
<tr>
<td>Password:</td>
<td><input type="password" name="pwd"></td>
</tr>
<tr>
<td>E-mail:</td>
<td><input type="text" name="email"></td>
</tr>
<tr>
<td>Phone Number:</td>
<td><input type="text" name="phno" size="12" maxlength="10"></td>
</tr>
<tr>
<td>Gender:</td>
<td><input type="radio" name="gender" checked>Male &nbsp;
<input type="radio" name="gender">Female</td>
</tr>
<tr>
<td>Date Of Birth:</td>
<td><input type="date" name="dob"></td>
</tr>
<tr>
<td>Languages Known:</td>
<td><input type="checkbox" name="chkEng" checked>English &nbsp;
<input type="checkbox" name="chkHIn">Hindi &nbsp;
<input type="checkbox" name="chkTel">Telugu &nbsp;
<input type="checkbox" name="chkTam">Tamil &nbsp;</td>
</tr>
<tr>
<td><select name="states" align="center">
<option value="Select">Select State</option>
<option value="Telangana">TS</option>
<option value="AP">Andhra Pradesh</option>
<option value="MP">MP</option>
<option value="Karnataka">Karnataka</option>
<option value="Tamilnadu">TN</option>
</select></td>
<td><select name="dist" align="center">
<option value="Select">SelectDist</option>
<option value="Hyderabad">Hyderabad</option>
<option value="Warangal">Warangal</option>
<option value="RangaReddy">Ranga Reddy</option>
<option value="Karimnagar">Karimnagar</option>
<option value="Nalgonda">Nalgonda</option>
</select></td>
</tr>
<tr>
<td>Address:</td>
<td><textarea rows="5" cols="20" name="txtAddress"></textarea></td>
</tr>
<td colspan="2" align="center"><input type="submit" value="Register">&nbsp;
<input type="reset" value="Reset"></td>
</tr>
</table>
</body>
</html>
