<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Example</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
          crossorigin="anonymous"></script>
</head>
<body>
  <div class="container-fluid mt-3">
    <div class="mt-4 p-5 bg-dark text-white text-center rounded-4">
      <h1>Shopping Cart</h1>
      <ul class="nav justify-content-center">
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="login.html">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="register.html">Register</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid text-center">
    <div class="row p-2 rounded">
      
      <!-- Camera -->
      <div class="col-md-4 p-5 bg-info">
        <h4>Camera</h4>
        <figure class="figure">
          <img src="camera.webp" class="figure-img img-fluid rounded" alt="Camera">
          <figcaption class="figure-caption">Canon digital</figcaption>
        </figure>
        <h4>Rs.60,000</h4>
        <hr>
        <div class="label-rating">1500 Reviews<br>&#9733; &#9733; &#9733;</div>
        <button class="btn btn-success">Add to Cart</button>
      </div>

      <!-- Watch -->
      <div class="col-md-4 p-5 bg-info">
        <h4>Watch</h4>
        <figure class="figure">
          <img src="watch.jpg" class="figure-img img-fluid rounded" alt="Watch">
          <figcaption class="figure-caption">Watch</figcaption>
        </figure>
        <h4>Rs.40,000</h4>
        <hr>
        <div class="label-rating">1500 Reviews<br>&#9733; &#9733; &#9733;</div>
        <button class="btn btn-success">Add to Cart</button>
      </div>

      <!-- Clock -->
      <div class="col-md-4 p-5 bg-info">
        <h4>Clock</h4>
        <figure class="figure">
          <img src="clock.webp" class="figure-img img-fluid rounded" alt="Clock">
          <figcaption class="figure-caption">Clock</figcaption>
        </figure>
        <h4>Rs.80,000</h4>
        <hr>
        <div class="label-rating">1500 Reviews<br>&#9733; &#9733; &#9733;</div>
        <button class="btn btn-success">Add to Cart</button>
      </div>

    </div>
  </div>
</body>
</html>
