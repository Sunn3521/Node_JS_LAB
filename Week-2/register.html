<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
          crossorigin="anonymous"></script>
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-4">Registration Page</h2>
  <form name="register" method="post" onsubmit="return validateForm()">
    <div class="mb-3">
      <label for="uname" class="form-label">User Name</label>
      <input type="text" class="form-control" id="uname" name="uname" required minlength="3">
    </div>
    <div class="mb-3">
      <label for="pwd" class="form-label">Password</label>
      <input type="password" class="form-control" id="pwd" name="pwd" required minlength="6">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">E-mail</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
      <label for="phno" class="form-label">Phone Number</label>
      <input type="text" class="form-control" id="phno" name="phno" maxlength="10" pattern="[0-9]{10}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Gender</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" value="Male" required>
        <label class="form-check-label">Male</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" value="Female">
        <label class="form-check-label">Female</label>
      </div>
    </div>
    <div class="mb-3">
      <label for="dob" class="form-label">Date Of Birth</label>
      <input type="date" class="form-control" id="dob" name="dob" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Languages Known</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="chkEng">
        <label class="form-check-label">English</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="chkHin">
        <label class="form-check-label">Hindi</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="chkTel">
        <label class="form-check-label">Telugu</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="chkTam">
        <label class="form-check-label">Tamil</label>
      </div>
    </div>
    <div class="mb-3">
      <label for="states" class="form-label">State</label>
      <select class="form-select" id="states" name="states" required>
        <option value="">Select State</option>
        <option value="Telangana">Telangana</option>
        <option value="AP">Andhra Pradesh</option>
        <option value="MP">Madhya Pradesh</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Tamilnadu">Tamil Nadu</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="dist" class="form-label">District</label>
      <select class="form-select" id="dist" name="dist" required>
        <option value="">Select District</option>
        <option value="Hyderabad">Hyderabad</option>
        <option value="Warangal">Warangal</option>
        <option value="RangaReddy">Ranga Reddy</option>
        <option value="Karimnagar">Karimnagar</option>
        <option value="Nalgonda">Nalgonda</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="txtAddress" class="form-label">Address</label>
      <textarea class="form-control" id="txtAddress" name="txtAddress" rows="3" required minlength="10"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
    <button type="reset" class="btn btn-secondary">Reset</button>
  </form>
</div>

<script>
  function validateForm() {
    let uname = document.register.uname.value.trim();
    let pwd = document.register.pwd.value.trim();
    let phno = document.register.phno.value.trim();
    let dob = document.register.dob.value;
    let address = document.register.txtAddress.value.trim();

    if (uname.length < 3) {
      alert("Username must be at least 3 characters long.");
      return false;
    }
    if (pwd.length < 6) {
      alert("Password must be at least 6 characters long.");
      return false;
    }
    if (!/^\d{10}$/.test(phno)) {
      alert("Phone number must be exactly 10 digits.");
      return false;
    }
    let today = new Date();
    let birthDate = new Date(dob);
    if (birthDate > today) {
      alert("Date of Birth cannot be in the future.");
      return false;
    }
    let chkEng = document.register.chkEng.checked;
    let chkHin = document.register.chkHin.checked;
    let chkTel = document.register.chkTel.checked;
    let chkTam = document.register.chkTam.checked;
    if (!chkEng && !chkHin && !chkTel && !chkTam) {
      alert("Please select at least one language.");
      return false;
    }
    if (address.length < 10) {
      alert("Address must be at least 10 characters long.");
      return false;
    }
    return true;
  }
</script>
</body>
</html>
