<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
body{
background-color:#f5f5f5;
}

.product:hover{
transform:scale(1.05);
transition:0.3s;
}

.rating{
color:orange;
}
</style>

</head>

<body>

<div class="container-fluid mt-3">

<div class="mt-4 p-5 bg-dark text-white text-center rounded-4">
<h1>Shopping Cart</h1>

<ul class="nav justify-content-center mt-3">

<li class="nav-item">
<a class="nav-link text-white" href="#">Home</a>
</li>

<li class="nav-item">
<a class="nav-link text-white" href="login.html">Login</a>
</li>

<li class="nav-item">
<a class="nav-link text-white" href="register.html">Register</a>
</li>

</ul>
</div>

</div>


<div class="container mt-5 text-center">

<div class="row g-4">

<div class="col-md-4">

<div class="card product p-3 shadow">

<h4>Camera</h4>

<img src="camera.webp" class="img-fluid rounded" alt="Camera">

<p class="mt-2">Canon digital</p>

<h5>Rs.60,000</h5>

<hr>

<p>1500 Reviews</p>

<div class="rating">&#9733; &#9733; &#9733;</div>

<button class="btn btn-success mt-3">Add to Cart</button>

</div>

</div>


<div class="col-md-4">

<div class="card product p-3 shadow">

<h4>Watch</h4>

<img src="watch.jpg" class="img-fluid rounded" alt="Watch">

<p class="mt-2">Watch</p>

<h5>Rs.40,000</h5>

<hr>

<p>1500 Reviews</p>

<div class="rating">&#9733; &#9733; &#9733;</div>

<button class="btn btn-success mt-3">Add to Cart</button>

</div>

</div>


<div class="col-md-4">

<div class="card product p-3 shadow">

<h4>Clock</h4>

<img src="clock.webp" class="img-fluid rounded" alt="Clock">

<p class="mt-2">Clock</p>

<h5>Rs.80,000</h5>

<hr>

<p>1500 Reviews</p>

<div class="rating">&#9733; &#9733; &#9733;</div>

<button class="btn btn-success mt-3">Add to Cart</button>

</div>

</div>

</div>

</div>

</body>
</html>
